name: Publish

on:
  push:
    branches: [dev]
    tags: ['v*']
  workflow_dispatch:

jobs:
  # Stable release: publish to NuGet.org when a v* tag is pushed.
  # Uses NuGet Trusted Publishing (OIDC) — no long-lived API key is stored. A short-lived
  # key is minted at publish time by exchanging a GitHub OIDC token with nuget.org, which
  # authorizes it against a Trusted Publishing policy (owner + repo + publish.yml + the
  # `release` environment). The job is a no-op until the `NUGET_USER` repo variable is set.
  release:
    name: Publish release to NuGet.org
    if: startsWith(github.ref, 'refs/tags/v') && vars.NUGET_USER != ''
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write  # required to request the GitHub OIDC token
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Pack
        run: dotnet pack src/AzureExtensions.Functions.OpenApi/AzureExtensions.Functions.OpenApi.csproj -c Release -o artifacts

      # Mint a short-lived NuGet API key from the GitHub OIDC token. The key is valid ~1 hour
      # and single-use, so this runs immediately before the push.
      - name: NuGet login (OIDC -> temporary API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push to NuGet.org
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

  # Prerelease channel: publish to GitHub Packages on every push to dev.
  # Uses the built-in GITHUB_TOKEN — no secret to configure.
  preview:
    name: Publish prerelease to GitHub Packages
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Pack
        run: dotnet pack src/AzureExtensions.Functions.OpenApi/AzureExtensions.Functions.OpenApi.csproj -c Release -o artifacts

      - name: Push to GitHub Packages
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "${{ secrets.GITHUB_TOKEN }}"
          --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
          --skip-duplicate
