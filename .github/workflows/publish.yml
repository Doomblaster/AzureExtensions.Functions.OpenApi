name: Publish

on:
  push:
    branches: [dev]
    tags: ['v*']
  workflow_dispatch:

jobs:
  # Stable release: publish to NuGet.org when a v* tag is pushed.
  # Gated on the NUGET_API_KEY secret so the workflow is a no-op until it is configured.
  release:
    name: Publish release to NuGet.org
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Pack
        run: dotnet pack src/Azure.Functions.OpenApi/Azure.Functions.OpenApi.csproj -c Release -o artifacts

      - name: Check for NuGet API key
        if: env.NUGET_API_KEY == ''
        run: |
          echo "::warning::NUGET_API_KEY secret is not set — skipping publish to NuGet.org."
          echo "Add a repository secret named NUGET_API_KEY to enable publishing."

      - name: Push to NuGet.org
        if: env.NUGET_API_KEY != ''
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "$NUGET_API_KEY"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

  # Prerelease channel: publish to GitHub Packages on every push to dev.
  # Uses the built-in GITHUB_TOKEN — no secret to configure.
  preview:
    name: Publish prerelease to GitHub Packages
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Pack
        run: dotnet pack src/Azure.Functions.OpenApi/Azure.Functions.OpenApi.csproj -c Release -o artifacts

      - name: Push to GitHub Packages
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "${{ secrets.GITHUB_TOKEN }}"
          --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
          --skip-duplicate
