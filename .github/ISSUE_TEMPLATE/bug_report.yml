name: Bug report
description: Report a problem with AzureExtensions.Functions.OpenApi
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report! Please fill out the sections below.
        For security vulnerabilities, do **not** use this form — see [SECURITY.md](../../SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the bug, including what you expected to happen.
      placeholder: When I call AddOpenApi() and request /openapi.json, ...
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal steps (ideally a small code snippet or repo) that reproduce the issue.
      placeholder: |
        1. Register with '...'
        2. Add an HttpTrigger '...'
        3. Request '...'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect the generated OpenAPI document (or behavior) to be?
    validations:
      required: false
  - type: input
    id: package-version
    attributes:
      label: Package version
      description: Which version of AzureExtensions.Functions.OpenApi are you using?
      placeholder: e.g. 0.0.0-preview.0.8
    validations:
      required: true
  - type: input
    id: dotnet-version
    attributes:
      label: .NET SDK / runtime version
      placeholder: e.g. 10.0.203
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Functions worker version, hosting model, and anything else relevant.
      placeholder: Windows 11, isolated worker v4, ...
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or output
      description: Paste any exceptions, stack traces, or generated document snippets. This is automatically formatted as code.
      render: shell
    validations:
      required: false
